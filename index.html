<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Intro section with dropdown navigation</title>
  </head>
  <body>
    <header>
      <a href="#"><img src="./images/logo.svg" alt="logo" class="logo" /></a>

      <nav id="navigation">
        <ul class="nav-list">
          <li class="nav-item" id="dropdown-item1">
            <button
              aria-expanded="false"
              aria-controls="submenu-one"
              class="dropdown-btn"
            >
              Features
              <svg width="10" height="6" xmlns="http://www.w3.org/2000/svg">
                <path
                  stroke="currentColor"
                  stroke-width="1.5"
                  fill="none"
                  d="m1 1 4 4 4-4"
                />
              </svg>
            </button>
            <ul hidden class="dropdown-list" id="submenu-one">
              <li>
                <a href="#"
                  ><img src="./images/icon-todo.svg" alt="" />Todo List</a
                >
              </li>
              <li>
                <a href="#"
                  ><img src="./images/icon-calendar.svg" alt="" />Calendar</a
                >
              </li>
              <li>
                <a href="#"
                  ><img src="./images/icon-reminders.svg" alt="" />Reminders</a
                >
              </li>
              <li>
                <a href="#"
                  ><img src="./images/icon-planning.svg" alt="" />Planning</a
                >
              </li>
            </ul>
          </li>

          <li class="nav-item" id="dropdown-item2">
            <button
              aria-expanded="false"
              aria-controls="submenu-two"
              class="dropdown-btn"
            >
              Company
              <svg width="10" height="6" xmlns="http://www.w3.org/2000/svg">
                <path
                  stroke="currentColor"
                  stroke-width="1.5"
                  fill="none"
                  d="m1 1 4 4 4-4"
                />
              </svg>
            </button>
            <ul hidden id="submenu-two" class="dropdown-list">
              <li><a href="#">History</a></li>
              <li><a href="#">Our Team</a></li>
              <li><a href="#">Blog</a></li>
            </ul>
          </li>
          <li class="nav-item"><a href="#" class="nav-link">Careers</a></li>
          <li class="nav-item"><a href="#" class="nav-link">About</a></li>
        </ul>
      </nav>
      <button class="mobile-menu-toggle-button">
        <img src="./images/icon-menu.svg" alt="" />
      </button>
      <div class="cta-container">
        <button class="btn-link">Login</button>
        <button class="btn btn-outline">Register</button>
      </div>
    </header>
    <main>
      <div class="wrapper">
        <section class="intro">
          <section class="intro-content">
            <div>
              <h1>Make <br />remote work</h1>
              <p class="intro-description">
                Get your team in sync, no matter your location. Streamline
                processes, create team rituals, and watch productivity soar.
              </p>
              <button class="btn btn-primary">Learn more</button>
            </div>
            <ul>
              <li><img src="./images/client-databiz.svg" alt="" /></li>
              <li><img src="./images/client-audiophile.svg" alt="" /></li>
              <li><img src="./images/client-meet.svg" alt="" /></li>
              <li><img src="./images/client-maker.svg" alt="" /></li>
            </ul>
          </section>
          <section class="intro-image">
            <img
              src="./images/image-hero-desktop.png"
              alt="hero section image"
            />
          </section>
        </section>
      </div>
    </main>
    <script src="./index.js" defer></script>
    <!-- Features
        Company
        Careers
        About

        
        

        

        Get your team in sync, no matter your location. Streamline processes, 
        create team rituals, and watch productivity soar.

        
        -->

      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer> -->
  </body>
</html>
