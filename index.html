<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />

    <title>Frontend Mentor | Intro section with dropdown navigation</title>
  </head>
  <body>
    <header>
      <nav>
        <a href="#"><img src="./images/logo.svg" alt="logo" class="logo" /></a>
        <ul class="nav-links">
          <li class="nav-item"><a href="#" class="nav-link">Features</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Company</a></li>
          <li class="nav-item"><a href="#" class="nav-link">Careers</a></li>
          <li class="nav-item"><a href="#" class="nav-link">About</a></li>
        </ul>
        <button class="mobile-menu-toggle-button">
          <img src="./images/icon-menu.svg" alt="" />
        </button>
        <div>
          <button>Login</button>
          <button>Register</button>
        </div>
      </nav>
    </header>
    <main>
      <div class="wrapper">
        <section class="intro">
          <section class="intro-content">
            <h1>Make remote work</h1>
            <p>
              Get your team in sync, no matter your location. Streamline
              processes, create team rituals, and watch productivity soar.
            </p>
            <button>Learn more</button>
            <ul>
              <li><img src="./images/client-databiz.svg" alt="" /></li>
              <li><img src="./images/client-databiz.svg" alt="" /></li>
              <li><img src="./images/client-meet.svg" alt="" /></li>
              <li><img src="./images/client-maker.svg" alt="" /></li>
            </ul>
          </section>
          <section class="intro-image">
            <img
              src="./images/image-hero-desktop.png"
              alt="hero section image"
            />
          </section>
        </section>
      </div>
    </main>
    <!-- Features
        Company
        Careers
        About

        
        

        

        Get your team in sync, no matter your location. Streamline processes, 
        create team rituals, and watch productivity soar.

        
        -->
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
